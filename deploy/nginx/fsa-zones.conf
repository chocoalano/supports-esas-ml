# /etc/nginx/conf.d/fsa-zones.conf - http context (Ubuntu includes conf.d/*.conf there).
#
# Two zones, never one. Keyed on the API key, not the address: all traffic
# comes from one Laravel server, so a per-IP limit would treat every tenant as
# one caller. And one zone for both runtimes would let a burst of synthesis
# spend attendance's allowance - exactly what running Speech apart prevents.
#
# The rates are examples to tune per deployment. That there are two is not.
limit_req_zone $http_x_api_key zone=faceapi:10m rate=60r/m;
limit_req_zone $http_x_api_key zone=speech:10m  rate=60r/m;

# Where each runtime lives. One Speech instance on the Face host, or several on
# hosts of their own: add `server` lines, nothing in the application changes.
# The runtimes are stateless - no session, no stored audio - so any instance
# can answer any request and no stickiness is needed.
upstream fsa_face {
    server 127.0.0.1:8001;
}
upstream fsa_speech {
    server 127.0.0.1:8002;
    # server 10.0.0.12:8002;
    # server 10.0.0.13:8002;
}
