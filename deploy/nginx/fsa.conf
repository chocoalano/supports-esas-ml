# /etc/nginx/sites-available/fsa.conf  (link it into sites-enabled)
#
# One public server, two runtimes behind it (upstreams in fsa-zones.conf):
#   /api/v1/face/, /api/v1/liveness/, /api/v1/health  -> fsa_face
#   /api/v1/speech/                                    -> fsa_speech
# Anything else - /, /demo, /docs, /openapi.json - is a 404 here.
server {
    # Bentuk lama, karena nginx di Ubuntu 22.04 (1.18) dan 24.04 (1.24) belum
    # mengenal direktif `http2 on;` yang baru ada sejak 1.25.1.
    listen 443 ssl http2;
    server_name face-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/face-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/face-api.example.com/privkey.pem;

    client_body_timeout 120s;
    limit_req_status    429;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;

    # --- Face runtime: unchanged from the single-runtime configuration --------------

    # Probe kesiapan: tanpa kunci, tanpa pembatas laju.
    location = /api/v1/health {
        proxy_pass http://fsa_face;
        access_log off;
    }

    location /api/v1/face/ {
        limit_req zone=faceapi burst=20 nodelay;
        # 5 foto x 8 MB + video 64 MB, ditambah overhead multipart.
        client_max_body_size 128m;
        proxy_read_timeout 180s;
        proxy_pass http://fsa_face;
    }

    location /api/v1/liveness/ {
        limit_req zone=faceapi burst=20 nodelay;
        client_max_body_size 128m;
        proxy_read_timeout 180s;
        proxy_pass http://fsa_face;
    }

    # --- Speech runtime -------------------------------------------------------------

    location /api/v1/speech/ {
        limit_req zone=speech burst=10 nodelay;
        # Follows FSA_STT_MAX_AUDIO_BYTES (25 MB by default) plus a margin for
        # multipart framing, so an oversize upload is refused by the application
        # - a JSON 413 it logs - and not by an HTML page from here.
        client_max_body_size 32m;
        # Synchronous requests: Laravel waits 130 s, so a timeout is always
        # nginx's 504, never a hang. How long a transcription takes depends on
        # the model and hardware chosen; FSA_STT_MAX_AUDIO_SECONDS bounds it.
        proxy_read_timeout 120s;
        proxy_pass http://fsa_speech;
    }

    # --- Everything else ----------------------------------------------------------------

    # /, /demo, Swagger and anything unrouted: nothing to serve in production.
    location / {
        return 404;
    }
}
