# /etc/nginx/sites-available/fsa.conf  (link it into sites-enabled)
#
# One public server, two runtimes behind it:
#   /api/v1/face/, /api/v1/liveness/, /api/v1/health  -> fsa-face    127.0.0.1:8001
#   /api/v1/speech/                                    -> fsa-speech  127.0.0.1:8002
# Anything else - /, /demo, /docs, /openapi.json - is a 404 here.
server {
    # Bentuk lama, karena nginx di Ubuntu 22.04 (1.18) dan 24.04 (1.24) belum
    # mengenal direktif `http2 on;` yang baru ada sejak 1.25.1.
    listen 443 ssl http2;
    server_name face-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/face-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/face-api.example.com/privkey.pem;

    client_body_timeout 120s;
    limit_req_status    429;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;

    # --- Face runtime: unchanged from the single-runtime configuration --------------

    # Probe kesiapan: tanpa kunci, tanpa pembatas laju.
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8001;
        access_log off;
    }

    location /api/v1/face/ {
        limit_req zone=faceapi burst=20 nodelay;
        # 5 foto x 8 MB + video 64 MB, ditambah overhead multipart.
        client_max_body_size 128m;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:8001;
    }

    location /api/v1/liveness/ {
        limit_req zone=faceapi burst=20 nodelay;
        client_max_body_size 128m;
        proxy_read_timeout 180s;
        proxy_pass http://127.0.0.1:8001;
    }

    # --- Speech runtime -------------------------------------------------------------

    location /api/v1/speech/ {
        limit_req zone=speech burst=10 nodelay;
        # The application refuses audio over 25 MB itself (FSA_STT_MAX_AUDIO_BYTES)
        # with a JSON 413 it logs; nginx allows a margin for multipart framing so
        # that refusal is the application's, not an HTML page from here.
        client_max_body_size 32m;
        # Synchronous and bounded: the audio cap keeps a transcription under this.
        # Laravel waits 130 s, so a timeout is always nginx's 504, never a hang.
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8002;
    }

    # --- Everything else ----------------------------------------------------------------

    # /, /demo, Swagger and anything unrouted: nothing to serve in production.
    location / {
        return 404;
    }
}
